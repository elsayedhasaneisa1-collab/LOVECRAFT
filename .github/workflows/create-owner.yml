name: Create LOVECRAFT Owner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-owner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Create Owner
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OWNER_USERNAME: ${{ secrets.OWNER_USERNAME }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
        run: node scripts/create-owner.mjs
