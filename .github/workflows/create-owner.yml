name: Create LOVECRAFT Owner

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read

jobs:
create-owner:
runs-on: ubuntu-latest
timeout-minutes: 10

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Install dependencies
    run: npm ci

  - name: Create Owner Account
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OWNER_USERNAME: ${{ secrets.OWNER_USERNAME }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
    run: node scripts/create-owner.mjs
